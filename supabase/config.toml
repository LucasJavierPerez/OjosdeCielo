project_id = "ojosdecielo"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://localhost:5174"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "Confirmá tu cuenta en Ojos de Cielo"

# Inyecta el rol en el JWT. Sin esto, rol_actual() siempre devuelve 'cliente'
# y el personal de la clínica no ve nada (ver 20260812120100_perfiles_y_roles.sql).
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

[analytics]
enabled = false

[edge_runtime]
enabled = true
policy = "oneshot"

# Estas dos las invoca el navegador directo (no el cliente de Supabase), así
# que el preflight OPTIONS tiene que llegar a la función sin JWT — la propia
# función verifica la sesión con su lógica, más específica que el gate
# genérico (admin para invitar_personal, admin para enviar-campana).
[functions.enviar-campana]
verify_jwt = false

[functions.invitar-personal]
verify_jwt = false

[functions.crear-tutor]
verify_jwt = false
